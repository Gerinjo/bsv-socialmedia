name: Story-Vorschauen rendern

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ImageMagick installieren
        run: sudo apt-get update && sudo apt-get install --yes imagemagick
      - run: npm run render:all
      - uses: actions/upload-artifact@v4
        with:
          name: bsv-story-previews
          path: output/
