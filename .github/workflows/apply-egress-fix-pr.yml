name: Apply Supabase egress fix on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.head_ref == 'fix/reduce-supabase-egress'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply targeted egress fixes
        run: python .github/scripts/apply-egress-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Run project checks
        run: npm run check

      - name: Commit optimized code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: reduce Supabase storage egress"
          git push origin HEAD:${{ github.head_ref }}
