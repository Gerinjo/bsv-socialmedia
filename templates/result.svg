<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}
      .team{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-2px}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="#f4f1e8"/>
  <rect width="1080" height="1260" fill="url(#top)"/>
  <circle cx="962" cy="358" r="430" fill="url(#glow)"/>
  <circle cx="982" cy="380" r="255" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".18"/>
  <circle cx="982" cy="380" r="135" fill="none" stroke="#ffffff" stroke-width="3" opacity=".09"/>
  <path d="M0 1165c265 118 520 75 720-10 145-62 258-55 360-8v280H0z" fill="#f4f1e8"/>
  <path d="M0 1165c265 118 520 75 720-10 145-62 258-55 360-8" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".58"/>

  <image href="{{LOGO_DATA_URI}}" x="72" y="64" width="104" height="104"/>
  <text x="208" y="106" fill="#a8cbb4" font-size="22" class="caps">BSV NORDSTERN</text>
  <text x="208" y="141" fill="#ffffff" font-size="24" class="sans" font-weight="800">Radolfzell · Fußball</text>
  <circle cx="982" cy="116" r="38" fill="#f4d638"/>
  <circle cx="982" cy="116" r="17" fill="#092f20"/>

  <g transform="translate(72 242)">
    <rect width="410" height="54" rx="27" fill="#a8cbb4"/>
    <text x="205" y="36" text-anchor="middle" fill="#092f20" font-size="18" class="caps">{{KICKER}}</text>
  </g>

  <text x="72" y="455" fill="#ffffff" font-size="{{RESULT_LABEL_SIZE}}" class="team">{{RESULT_LABEL}}</text>
  <text x="72" y="548" fill="#a8cbb4" font-size="62" class="serif" font-style="italic">{{COMPETITION}}</text>
  <g transform="translate(650 417)">
    <rect width="342" height="108" rx="54" fill="#ffffff" opacity=".08"/>
    <text x="171" y="64" text-anchor="middle" fill="#ffffff" font-size="18" class="caps">90 MINUTEN · 1 TEAM</text>
  </g>

  <g transform="translate(72 664)">
    <rect x="14" y="20" width="936" height="612" rx="62" fill="#071f16" opacity=".28"/>
    <rect width="936" height="612" rx="62" fill="#ffffff"/>
    <rect x="350" y="36" width="236" height="50" rx="25" fill="#dce9df"/>
    <text x="468" y="69" text-anchor="middle" fill="#164f32" font-size="18" class="caps">ENDSTAND</text>

    <g transform="translate(148 112)">
      <rect width="640" height="200" rx="100" fill="#f4f1e8"/>
      <text x="320" y="153" text-anchor="middle" fill="#092f20" font-size="188" class="team">{{HOME_SCORE}} : {{AWAY_SCORE}}</text>
    </g>

    <text x="468" y="388" text-anchor="middle" fill="#10251a" font-size="38" class="team">{{HOME_TEAM}}</text>
    <g transform="translate(398 417)">
      <rect width="140" height="48" rx="24" fill="#092f20"/>
      <text x="70" y="32" text-anchor="middle" fill="#ffffff" font-size="17" class="caps">GEGEN</text>
    </g>
    <text x="468" y="520" text-anchor="middle" fill="#10251a" font-size="38" class="team">{{AWAY_TEAM}}</text>
    <text x="468" y="574" text-anchor="middle" fill="#164f32" font-size="22" class="sans" font-weight="900">{{DATE}}</text>
  </g>

  <g transform="translate(72 1372)">
    <rect width="936" height="218" rx="58" fill="#ffffff"/>
    <circle cx="836" cy="109" r="66" fill="#dce9df"/>
    <circle cx="836" cy="109" r="26" fill="#91c82f"/>
    <text x="42" y="88" fill="#164f32" font-size="{{RESULT_MESSAGE_SIZE}}" class="serif" font-style="italic">{{RESULT_MESSAGE}}</text>
    <text x="42" y="150" fill="#6c7b71" font-size="18" class="caps">DANKE, NORDSTERN-FAMILIE!</text>
  </g>

  <g transform="translate(72 1652)">
    <rect width="344" height="62" rx="31" fill="#092f20"/>
    <text x="172" y="40" text-anchor="middle" fill="#ffffff" font-size="23" class="sans" font-weight="900">#nurderbsv</text>
  </g>
  <text x="72" y="1800" fill="#164f32" font-size="20" class="sans" font-weight="900">WAS. FÜR. EIN. SPIEL.</text>
  <text x="1008" y="1800" text-anchor="end" fill="#092f20" font-size="20" class="sans" font-weight="900">bsvnordstern.de</text>
</svg>
