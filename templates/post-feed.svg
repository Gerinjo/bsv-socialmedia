<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="BSV Nordstern Instagram Post Template">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="0.55" stop-color="#0b2a1d"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="42%">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="photoClip">
      <rect x="90" y="190" width="900" height="540" rx="42"/>
    </clipPath>
    <style>
      @font-face{font-family:'Capture it';src:url('data:font/truetype;base64,') format('truetype')}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:3px}
      .sans{font-family:Inter,Arial,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif}
      .hand{font-family:'Capture it',Impact,Inter,sans-serif;font-weight:400;letter-spacing:2px}
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <circle cx="840" cy="220" r="360" fill="url(#glow)"/>

  <g>
    <image href="data:image/png;base64," x="64" y="56" width="104" height="104" opacity="0.96"/>
    <text x="196" y="95" fill="#a8cbb4" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">BSV NORDSTERN</text>
    <text x="196" y="141" fill="#ffffff" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">RADOLFZELL</text>

    <g transform="translate(818 54)">
      <rect x="0" y="0" width="176" height="56" rx="28" fill="#f4d638"/>
      <text x="88" y="36" text-anchor="middle" fill="#071f16" font-size="18" class="caps">MATCHDAY</text>
    </g>
  </g>

  <g>
    <text x="90" y="200" fill="#ffffff" font-size="52" class="sans" font-weight="900">BSV Nordstern</text>
    <text x="90" y="250" fill="#a8cbb4" font-size="30" class="sans" font-weight="700">vs. TSV Musterstadt</text>
    <text x="990" y="207" text-anchor="end" fill="#f4d638" font-size="28" class="caps">14. SPIELTAG</text>
  </g>

  <g transform="translate(0 0)">
    <rect x="90" y="190" width="900" height="540" rx="42" fill="#f4f1e8" opacity="0.12"/>
    <g clip-path="url(#photoClip)">
      <rect width="1080" height="1350" fill="#0f2f24"/>
      <rect x="0" y="0" width="900" height="540" fill="url(#bg)"/>
      <circle cx="730" cy="110" r="180" fill="#a8cbb4" opacity="0.18"/>
      <circle cx="610" cy="430" r="250" fill="#91c82f" opacity="0.12"/>
      <rect x="90" y="190" width="900" height="540" fill="#f4f1e8" opacity="0.03"/>
      <g opacity="0.74">
        <path d="M120 420C260 280 420 290 560 370C720 460 820 420 900 300L900 730H120Z" fill="#0d3525"/>
        <path d="M220 380L345 260L460 360L540 280L705 405L820 325L900 380V730H220Z" fill="#164f32" opacity="0.7"/>
      </g>
      <g>
        <circle cx="494" cy="311" r="128" fill="#f4f1e8" opacity="0.12"/>
        <circle cx="494" cy="311" r="88" fill="#f4d638" opacity="0.78"/>
        <path d="M468 316L488 336L534 288" fill="none" stroke="#071f16" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="450" y="505" text-anchor="middle" fill="#f4f1e8" font-size="28" class="caps" opacity="0.85">BILD HIER EINSETZEN</text>
    </g>
  </g>

  <g>
    <rect x="90" y="750" width="900" height="140" rx="30" fill="#f4f1e8" opacity="0.96"/>
    <text x="150" y="800" fill="#10251a" font-size="54" class="sans" font-weight="900">2</text>
    <text x="190" y="800" fill="#10251a" font-size="28" class="sans" font-weight="700">:</text>
    <text x="218" y="800" fill="#10251a" font-size="54" class="sans" font-weight="900">1</text>
    <text x="310" y="790" fill="#10251a" font-size="28" class="caps">BSV NORDSTERN</text>
    <text x="310" y="826" fill="#6c7b71" font-size="22" class="sans" font-weight="700">TSV Musterstadt</text>
    <text x="990" y="824" text-anchor="end" fill="#164f32" font-size="22" class="caps">FREUDE · 14. SPIELTAG</text>
  </g>

  <g>
    <rect x="90" y="910" width="900" height="300" rx="34" fill="#f4f1e8" opacity="0.96"/>
    <text x="126" y="962" fill="#164f32" font-size="34" class="caps">SPIELBERICHT</text>
    <text x="126" y="1025" fill="#10251a" font-size="27" class="sans" font-weight="700">Nach einem intensiven Match setzte sich der BSV Nordstern verdient mit 2:1 durch.</text>
    <text x="126" y="1075" fill="#10251a" font-size="24" class="sans" font-weight="500">Die Gäste starteten druckvoll, doch nach einer schwachen Phase im Mittelfeld</text>
    <text x="126" y="1115" fill="#10251a" font-size="24" class="sans" font-weight="500">fanden die Nordsterner besser ins Spiel und wurden durch schnelle Kombinationen</text>
    <text x="126" y="1155" fill="#10251a" font-size="24" class="sans" font-weight="500">immer gefährlicher. In der zweiten Halbzeit war der BSV deutlich am Drücker.</text>
    <text x="126" y="1195" fill="#10251a" font-size="24" class="sans" font-weight="500">Die Entscheidung fiel nach einer präzisen Flanke und einem starken Abschluss.</text>
  </g>

  <g>
    <rect x="0" y="1240" width="1080" height="110" fill="#f4f1e8"/>
    <rect x="0" y="1240" width="1080" height="110" fill="url(#bg)" opacity="0.45"/>
    <text x="90" y="1302" fill="#f4f1e8" font-size="22" class="caps">SPONSOR</text>
    <rect x="280" y="1268" width="180" height="56" rx="18" fill="#f4d638"/>
    <text x="370" y="1306" text-anchor="middle" fill="#071f16" font-size="20" class="caps">SPARKASSE</text>
    <text x="510" y="1305" fill="#ffffff" font-size="26" class="sans" font-weight="700">Hegau-Bodensee</text>
    <text x="990" y="1304" text-anchor="end" fill="#a8cbb4" font-size="18" class="caps">#aufsgehtsgrün</text>
  </g>
</svg>
