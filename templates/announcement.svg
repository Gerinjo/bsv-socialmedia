<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="0.58" stop-color="#092f20"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" opacity=".04"/>
    </pattern>
    <clipPath id="matchCardClip">
      <rect width="936" height="596" rx="54"/>
    </clipPath>
    <style>
      @font-face{font-family:'Capture it';src:url('{{HANDWRITTEN_FONT_DATA_URI}}') format('truetype');font-weight:400;font-style:normal}
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
      .handwritten{font-family:'Capture it',Impact,Inter,sans-serif;font-weight:400;letter-spacing:2px}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}
      .team{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-2px}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#dots)"/>
  <circle cx="1000" cy="420" r="440" fill="url(#glow)"/>
  <circle cx="1018" cy="454" r="280" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".18"/>
  <circle cx="1018" cy="454" r="172" fill="none" stroke="#ffffff" stroke-width="3" opacity=".1"/>
  <path d="M-100 1450C180 1260 420 1350 630 1250s390-90 550-260v930H-100z" fill="#164f32" opacity=".58"/>
  <path d="M-120 1580c290-210 550-120 770-260 180-116 350-84 530-250" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".24"/>

  <image href="{{LOGO_DATA_URI}}" x="72" y="64" width="104" height="104"/>
  <text x="208" y="105" fill="#a8cbb4" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">BSV NORDSTERN</text>
  <text x="208" y="151" fill="#ffffff" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">RADOLFZELL</text>
  <g transform="translate(600 64)">
    <rect width="408" height="104" rx="30" fill="#ffffff" opacity=".1"/>
    <text x="204" y="70" text-anchor="middle" fill="#f4d638" font-size="{{TEAM_CATEGORY_SIZE}}" class="handwritten">{{TEAM_CATEGORY}}</text>
  </g>

  <g transform="translate(62 186) rotate(-4 350 64)">
    <text x="7" y="115" fill="#91c82f" font-size="132" class="handwritten" opacity=".72">{{KICKER}}</text>
    <text x="0" y="106" fill="#f4f1e8" font-size="132" class="handwritten">{{KICKER}}</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M842 218v34M825 235h34" stroke="#f4d638" stroke-width="6"/>
    <path d="M902 284v21M892 294h20" stroke="#a8cbb4" stroke-width="5"/>
    <path d="m873 185 9 9m0-9-9 9" stroke="#91c82f" stroke-width="5"/>
  </g>

  <text x="72" y="455" fill="#ffffff" font-size="150" class="team">SPIEL</text>
  <text x="72" y="568" fill="#a8cbb4" font-size="109" class="serif" font-style="italic">tag.</text>
  <g transform="translate(654 410)">
    <rect width="338" height="116" rx="58" fill="#ffffff" opacity=".08"/>
    <circle cx="58" cy="58" r="35" fill="#91c82f"/>
    <path d="m43 58 11 11 21-24" fill="none" stroke="#092f20" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="110" y="50" fill="#ffffff" font-size="18" class="caps">MORGEN</text>
    <text x="110" y="82" fill="#a8cbb4" font-size="18" class="caps">WIRD LAUT.</text>
  </g>

  <g transform="translate(72 660)">
    <rect x="16" y="22" width="936" height="596" rx="54" fill="#071f16" opacity=".32"/>
    <rect width="936" height="596" rx="54" fill="#f4f1e8"/>
    <image href="{{ACTION_PLAYER_DATA_URI}}" x="520" y="-70" width="390" height="693" opacity=".09" clip-path="url(#matchCardClip)"/>
    <text x="468" y="72" text-anchor="middle" fill="#164f32" font-size="28" class="handwritten">{{COMPETITION}}</text>

    <text x="58" y="142" fill="#10251a" font-size="{{HOME_TEAM_SIZE}}" class="team">{{HOME_TEAM}}</text>
    <image href="{{HOME_CREST_DATA_URI}}" x="280" y="175" width="140" height="140" preserveAspectRatio="xMidYMid meet" opacity="{{HOME_CREST_OPACITY}}"/>
    <line x1="468" y1="194" x2="468" y2="326" transform="rotate(15 468 260)" stroke="#111111" stroke-width="6" stroke-linecap="round" opacity="{{DUEL_MARK_OPACITY}}"/>
    <image href="{{AWAY_CREST_DATA_URI}}" x="530" y="205" width="140" height="140" preserveAspectRatio="xMidYMid meet" opacity="{{AWAY_CREST_OPACITY}}"/>
    <text x="878" y="398" text-anchor="end" fill="#10251a" font-size="{{AWAY_TEAM_SIZE}}" class="team">{{AWAY_TEAM}}</text>

    <line x1="58" y1="426" x2="878" y2="426" stroke="#cbd8ce" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(58 444)">
      <rect width="410" height="104" rx="34" fill="#ffffff"/>
      <text x="28" y="42" fill="#6c7b71" font-size="16" class="caps">DATUM</text>
      <text x="28" y="78" fill="#164f32" font-size="29" class="team">{{DATE}}</text>
    </g>
    <g transform="translate(488 444)">
      <rect width="390" height="104" rx="34" fill="#ffffff"/>
      <text x="362" y="42" text-anchor="end" fill="#6c7b71" font-size="16" class="caps">ANPFIFF</text>
      <text x="362" y="78" text-anchor="end" fill="#164f32" font-size="29" class="team">{{TIME}}</text>
    </g>
    <text x="468" y="590" text-anchor="middle" fill="#6c7b71" font-size="22" class="sans" font-weight="800">{{VENUE}}</text>
  </g>

  <g transform="translate(540 1010) rotate(-12)" opacity="{{GAME_STATUS_OPACITY}}">
    <text x="7" y="8" text-anchor="middle" dominant-baseline="middle" fill="#071f16" opacity=".52" font-size="{{GAME_STATUS_SIZE}}" class="handwritten">{{GAME_STATUS_LABEL}}</text>
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle" fill="#d62828" stroke="#f4f1e8" stroke-width="7" paint-order="stroke" font-size="{{GAME_STATUS_SIZE}}" class="handwritten">{{GAME_STATUS_LABEL}}</text>
  </g>

  {{SPONSOR_LOGOS}}

  <text x="72" y="1780" fill="#ffffff" font-size="34" class="handwritten" letter-spacing="1px">#aufgehtsgrün</text>
  <text x="1008" y="1780" text-anchor="end" fill="#ffffff" font-size="26" class="handwritten">bsvnordstern.de</text>
</svg>
