<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="0.62" stop-color="#092f20"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#ffffff" opacity=".035"/>
      <circle cx="17" cy="15" r="1" fill="#ffffff" opacity=".025"/>
    </pattern>
    <style>
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}
      .team{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-2px}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#grain)"/>

  <g opacity=".12" fill="none" stroke="#a8cbb4" stroke-width="3">
    <circle cx="1020" cy="960" r="430"/>
    <circle cx="1020" cy="960" r="175"/>
    <path d="M590 0v1920M590 960h490"/>
    <rect x="590" y="530" width="490" height="860"/>
    <rect x="815" y="705" width="265" height="510"/>
  </g>

  <rect x="72" y="192" width="936" height="4" fill="#a8cbb4"/>
  <image href="{{LOGO_DATA_URI}}" x="72" y="64" width="104" height="104"/>
  <text x="208" y="106" fill="#a8cbb4" font-size="22" class="caps">BSV NORDSTERN</text>
  <text x="208" y="141" fill="#ffffff" font-size="24" class="sans" font-weight="700">Radolfzell · Fußball</text>

  <text x="72" y="292" fill="#a8cbb4" font-size="22" class="caps">{{KICKER}}</text>
  <text x="72" y="446" fill="#ffffff" font-size="148" class="team">SPIEL</text>
  <text x="72" y="566" fill="#a8cbb4" font-size="120" class="serif" font-style="italic">tag.</text>

  <g transform="translate(72 665)">
    <rect x="18" y="18" width="918" height="496" fill="#a8cbb4" opacity=".28"/>
    <rect width="918" height="496" fill="#f4f1e8"/>
    <text x="44" y="58" fill="#164f32" font-size="19" class="caps">{{COMPETITION}}</text>
    <text x="44" y="142" fill="#10251a" font-size="50" class="team">{{HOME_TEAM}}</text>
    <text x="44" y="199" fill="#6c7b71" font-size="23" class="caps">GEGEN</text>
    <text x="44" y="280" fill="#10251a" font-size="50" class="team">{{AWAY_TEAM}}</text>
    <line x1="44" y1="323" x2="874" y2="323" stroke="#a8cbb4" stroke-width="3"/>
    <text x="44" y="388" fill="#164f32" font-size="35" class="team">{{DATE}}</text>
    <text x="874" y="388" text-anchor="end" fill="#164f32" font-size="35" class="team">{{TIME}}</text>
    <text x="44" y="447" fill="#6c7b71" font-size="25" class="sans" font-weight="700">{{VENUE}}</text>
  </g>

  <g transform="translate(72 1290)">
    <path d="M0 0h936v310H0z" fill="none" stroke="#a8cbb4" stroke-width="3"/>
    <circle cx="468" cy="155" r="89" fill="none" stroke="#a8cbb4" stroke-width="3"/>
    <line x1="468" y1="0" x2="468" y2="310" stroke="#a8cbb4" stroke-width="3"/>
    <text x="44" y="92" fill="#a8cbb4" font-size="20" class="caps">MORGEN GEMEINSAM</text>
    <text x="44" y="169" fill="#ffffff" font-size="48" class="team">AM PLATZ.</text>
    <text x="892" y="246" text-anchor="end" fill="#ffffff" font-size="30" class="sans" font-weight="800">#nurderbsv</text>
  </g>

  <text x="72" y="1681" fill="#a8cbb4" font-size="18" class="caps">SPIEL-ID · {{MATCH_ID_SHORT}}</text>
  <text x="1008" y="1681" text-anchor="end" fill="#ffffff" font-size="19" class="sans" font-weight="800">bsvnordstern.de</text>
</svg>
