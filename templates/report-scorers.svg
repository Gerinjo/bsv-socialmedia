<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071f16" stop-opacity=".06"/>
      <stop offset=".7" stop-color="#071f16" stop-opacity=".02"/>
      <stop offset="1" stop-color="#071f16" stop-opacity=".5"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity=".32"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#ffffff" opacity=".045"/>
    </pattern>
    <clipPath id="photoWave">
      <path d="M0 238C216 177 397 260 621 207c204-48 329-39 459 9v470c-235 76-421-18-640 47C250 780 111 773 0 731Z"/>
    </clipPath>
    <style>
      @font-face{font-family:'Capture it';src:url('{{HANDWRITTEN_FONT_DATA_URI}}') format('truetype');font-weight:400;font-style:normal}
      .sans{font-family:Inter,Arial,sans-serif}.handwritten{font-family:'Capture it',Impact,Inter,sans-serif;font-weight:400;letter-spacing:1px}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}.scorer{font-family:Inter,Arial,sans-serif;font-weight:900}
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#f4f1e8"/>
  <rect width="1080" height="760" fill="url(#background)"/>
  <rect width="1080" height="760" fill="url(#dots)"/>
  <circle cx="1015" cy="250" r="390" fill="url(#glow)"/>
  <circle cx="1015" cy="250" r="235" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".16"/>

  <image href="{{LOGO_DATA_URI}}" x="48" y="40" width="82" height="82"/>
  <text x="156" y="72" fill="#a8cbb4" font-size="18" class="caps">BSV NORDSTERN</text>
  <text x="156" y="104" fill="#ffffff" font-size="22" class="sans" font-weight="800">Radolfzell · Fußball</text>
  <text x="1032" y="78" text-anchor="end" fill="#a8cbb4" font-size="24" class="handwritten">{{COMPETITION}}</text>
  <text x="1032" y="108" text-anchor="end" fill="#ffffff" font-size="15" class="caps">SEITE {{REPORT_PAGE}} / {{REPORT_PAGE_COUNT}}</text>

  <g transform="translate(48 124) rotate(-3 350 44)">
    <text x="6" y="71" fill="#91c82f" font-size="76" class="handwritten" opacity=".72">TORSCHÜTZEN</text>
    <text x="0" y="65" fill="#f4f1e8" font-size="76" class="handwritten">TORSCHÜTZEN</text>
  </g>

  <rect x="0" y="190" width="1080" height="585" fill="#0b2b1e" clip-path="url(#photoWave)"/>
  <image href="{{ACTION_PLAYER_DATA_URI}}" x="0" y="172" width="1080" height="620" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoWave)"/>
  <rect x="0" y="172" width="1080" height="620" fill="url(#photoShade)" clip-path="url(#photoWave)"/>
  <path d="M0 238C216 177 397 260 621 207c204-48 329-39 459 9" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".78"/>
  <path d="M0 731c111 42 250 49 440-8 219-65 405 29 640-47" fill="none" stroke="#ffffff" stroke-width="5" opacity=".74"/>
  <path d="M0 748c141 37 278 26 446-26 217-67 411 34 634-31" fill="none" stroke="#91c82f" stroke-width="3" opacity=".82"/>

  <g transform="translate(48 770)">
    <text x="0" y="42" fill="#164f32" font-size="30" class="handwritten">UNSERE TORE</text>
    <text x="984" y="42" text-anchor="end" fill="#164f32" font-size="34" class="handwritten">{{HOME_SCORE}} : {{AWAY_SCORE}}</text>
    <line x1="0" y1="58" x2="984" y2="58" stroke="#a8cbb4" stroke-width="3" opacity=".6"/>
    <g transform="translate(0 82)">{{SCORER_ROWS}}</g>
  </g>

  <text x="48" y="1050" fill="#164f32" font-size="27" class="handwritten">#aufgehtsgrün</text>
  <text x="1032" y="1050" text-anchor="end" fill="#092f20" font-size="23" class="handwritten">bsvnordstern.de</text>
</svg>
