<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="BSV Nordstern Story">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071f16"/><stop offset="1" stop-color="#164f32"/></linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071f16" stop-opacity=".04"/><stop offset="1" stop-color="#071f16" stop-opacity=".55"/></linearGradient>
    <radialGradient id="headerGlow"><stop offset="0" stop-color="#91c82f" stop-opacity=".3"/><stop offset="1" stop-color="#91c82f" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#ffffff" opacity=".05"/></pattern>
    <clipPath id="photoClip"><path d="M0 474c188-62 365-18 548-40 201-24 360-15 532 43v758c-204 72-376 31-566 65-206 37-364 42-514-10Z"/></clipPath>
    <style>
      @font-face{font-family:'Capture it';src:url('{{HANDWRITTEN_FONT_DATA_URI}}') format('truetype');font-weight:400;font-style:normal}
      .sans{font-family:Inter,Arial,sans-serif}.handwritten{font-family:'Capture it',Impact,Inter,sans-serif;letter-spacing:1px}.caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:4px}
    </style>
  </defs>
  <rect width="1080" height="1920" fill="#f4f1e8"/>
  <path d="M0 0H1080V1392c-180-48-342 12-520 26-209 16-373-44-560 6Z" fill="url(#background)"/>
