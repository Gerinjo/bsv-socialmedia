  <text x="176" y="94" fill="#a8cbb4" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">BSV NORDSTERN</text>
  <text x="176" y="140" fill="#ffffff" font-size="42" class="caps" textLength="320" lengthAdjust="spacingAndGlyphs">RADOLFZELL</text>
  <text x="1019" y="105" text-anchor="end" fill="#f4d638" font-size="48" class="handwritten">{{STORY_CATEGORY}}</text>
  {{STORY_TITLE_LINES}}
  <path d="M0 494c188-62 365-18 548-40 201-24 360-15 532 43v758c-204 72-376 31-566 65-206 37-364 42-514-10Z" fill="#071f16" opacity=".34"/>
  <g clip-path="url(#photoClip)">
    <rect x="0" y="400" width="1080" height="940" fill="#0d3525"/>
