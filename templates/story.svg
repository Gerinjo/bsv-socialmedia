  <circle cx="1008" cy="290" r="420" fill="url(#headerGlow)"/>
  <circle cx="1026" cy="312" r="255" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".17"/>
  <circle cx="1026" cy="312" r="142" fill="none" stroke="#ffffff" stroke-width="3" opacity=".08"/>
  <path d="M-76 386C153 319 313 407 511 376c211-33 339-129 625-74" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".19"/>
  <path d="M-84 410c225-65 397 26 597-8 216-36 355-127 624-70" fill="none" stroke="#91c82f" stroke-width="3" opacity=".22"/>
