<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#092f20"/>
      <stop offset="1" stop-color="#071f16"/>
    </linearGradient>
    <radialGradient id="softGlow">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <style>
      @font-face{font-family:'Capture it';src:url('{{HANDWRITTEN_FONT_DATA_URI}}') format('truetype');font-weight:400;font-style:normal}
      .sans{font-family:Inter,Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}
      .handwritten{font-family:'Capture it',Impact,Inter,sans-serif;font-weight:400;letter-spacing:1px}
      .caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}
      .team{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:-2px}
      .number{font-family:Inter,Arial,sans-serif;font-size:35px;font-weight:950;fill:#092f20}
      .player{font-family:Inter,Arial,sans-serif;font-size:27px;font-weight:900;fill:#10251a}
      .empty{font-family:Inter,Arial,sans-serif;font-size:42px;font-weight:900;letter-spacing:4px;fill:#a8cbb4}
    </style>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <circle cx="930" cy="330" r="420" fill="url(#softGlow)"/>
  <circle cx="988" cy="344" r="258" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".18"/>
  <circle cx="988" cy="344" r="140" fill="none" stroke="#ffffff" stroke-width="3" opacity=".09"/>
  <path d="M-120 1510c260-190 510-90 720-210 210-119 370-72 600-245v865H-120z" fill="#164f32" opacity=".48"/>
  <path d="M-120 1660c260-190 500-112 720-225 208-106 390-79 600-246" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".2"/>

  <image href="{{LOGO_DATA_URI}}" x="72" y="64" width="104" height="104"/>
  <text x="208" y="106" fill="#a8cbb4" font-size="22" class="caps">BSV NORDSTERN</text>
  <text x="208" y="141" fill="#ffffff" font-size="24" class="sans" font-weight="800">Radolfzell · Fußball</text>
  <circle cx="982" cy="116" r="38" fill="#f4d638"/>
  <text x="982" y="124" text-anchor="middle" fill="#092f20" font-size="21" class="team">11</text>

  <g transform="translate(62 186) rotate(-4 350 64)">
    <text x="7" y="115" fill="#91c82f" font-size="132" class="handwritten" opacity=".72">MATCHDAY</text>
    <text x="0" y="106" fill="#f4f1e8" font-size="132" class="handwritten">MATCHDAY</text>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M842 218v34M825 235h34" stroke="#f4d638" stroke-width="6"/>
    <path d="M902 284v21M892 294h20" stroke="#a8cbb4" stroke-width="5"/>
    <path d="m873 185 9 9m0-9-9 9" stroke="#91c82f" stroke-width="5"/>
  </g>

  <text x="72" y="445" fill="#ffffff" font-size="122" class="team">UNSERE</text>
  <text x="72" y="555" fill="#a8cbb4" font-size="105" class="handwritten">Startelf.</text>
  <g transform="translate(676 417)">
    <rect width="316" height="112" rx="56" fill="#ffffff" opacity=".08"/>
    <text x="158" y="48" text-anchor="middle" fill="#91c82f" font-size="18" class="caps">EIN TEAM.</text>
    <text x="158" y="82" text-anchor="middle" fill="#ffffff" font-size="18" class="caps">EIN ZIEL.</text>
  </g>

  <g transform="translate(72 628)">
    <text x="0" y="0" fill="#ffffff" font-size="25" class="sans" font-weight="900">{{HOME_TEAM}}</text>
    <g transform="translate(664 -38)">
      <rect width="272" height="54" rx="27" fill="#91c82f"/>
      <text x="136" y="36" text-anchor="middle" fill="#092f20" font-size="18" class="caps">{{FORMATION}}</text>
    </g>
  </g>

  <rect x="64" y="674" width="952" height="778" rx="58" fill="none" stroke="#a8cbb4" stroke-width="3" opacity=".13"/>
  {{PLAYER_ROWS}}

  <g transform="translate(72 1496)">
    <rect width="936" height="190" rx="54" fill="#f4f1e8"/>
    <g transform="translate(842 95)">
      <circle r="58" fill="#ffffff" stroke="#164f32" stroke-width="4"/>
      <g transform="scale(.82)" fill="#164f32" stroke="#6c7b71" stroke-width="3" stroke-linejoin="round">
        <path d="M0-21 20-7 12 17-12 17-20-7z"/>
        <path d="M-18-67 18-67 24-49 0-37-24-49z"/>
        <path d="M50-42 68-21 68 8 48 7 36-19z"/>
        <path d="M68 25 50 52 27 68 20 47 36 30z"/>
        <path d="M-68 25-50 52-27 68-20 47-36 30z"/>
        <path d="M-50-42-68-21-68 8-48 7-36-19z"/>
      </g>
      <g transform="scale(.82)" fill="none" stroke="#6c7b71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0-21V-37M20-7 36-19M12 17 36 30M-12 17-36 30M-20-7-36-19"/>
      </g>
    </g>
    <text x="42" y="66" fill="#164f32" font-size="18" class="caps">HEUTE · {{TIME}}</text>
    <text x="42" y="130" fill="#10251a" font-size="39" class="team">VS. {{AWAY_TEAM}}</text>
  </g>

  <text x="72" y="1780" fill="#ffffff" font-size="34" class="handwritten" letter-spacing="1px">#aufgehtsgrün</text>
  <text x="1008" y="1780" text-anchor="end" fill="#ffffff" font-size="26" class="handwritten">bsvnordstern.de</text>
</svg>
