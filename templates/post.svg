<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071f16"/><stop offset="1" stop-color="#164f32"/></linearGradient>
    <linearGradient id="photoShade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071f16" stop-opacity=".03"/><stop offset="1" stop-color="#071f16" stop-opacity=".32"/></linearGradient>
    <pattern id="dots" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#ffffff" opacity=".045"/></pattern>
    <clipPath id="photoWave"><path d="M0 326C216 265 397 348 621 295c204-48 329-39 459 9v448c-235 76-421-18-640 47C250 856 111 849 0 807Z"/></clipPath>
    <style>
      @font-face{font-family:'Capture it';src:url('{{HANDWRITTEN_FONT_DATA_URI}}') format('truetype');font-weight:400;font-style:normal}
      .sans{font-family:Inter,Arial,sans-serif}.handwritten{font-family:'Capture it',Impact,Inter,sans-serif;font-weight:400;letter-spacing:1px}.caps{font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:5px}
    </style>
  </defs>
  <rect width="1080" height="1080" fill="#f4f1e8"/>
  <rect width="1080" height="836" fill="url(#background)"/><rect width="1080" height="836" fill="url(#dots)"/>
  <image href="{{LOGO_DATA_URI}}" x="48" y="40" width="82" height="82"/>
  <text x="156" y="72" fill="#a8cbb4" font-size="42" class="caps" textLength="300" lengthAdjust="spacingAndGlyphs">BSV NORDSTERN</text>
  <text x="156" y="116" fill="#ffffff" font-size="42" class="caps" textLength="300" lengthAdjust="spacingAndGlyphs">RADOLFZELL</text>
  <text x="1032" y="68" text-anchor="end" fill="#f4d638" font-size="{{TEAM_CATEGORY_SIZE}}" class="handwritten">{{TEAM_CATEGORY}}</text>
  <text x="1032" y="100" text-anchor="end" fill="#a8cbb4" font-size="18" class="handwritten">{{POST_AUDIENCE}}</text>
  <text x="1032" y="124" text-anchor="end" fill="#ffffff" font-size="12" class="caps">SEITE {{REPORT_PAGE}} / {{REPORT_PAGE_COUNT}}</text>
  <g transform="translate(48 142) rotate(-2 470 60)">
    <text x="6" y="88" fill="#91c82f" font-size="{{POST_TITLE_SIZE}}" class="handwritten" opacity=".7">{{POST_TITLE}}</text>
    <text x="0" y="81" fill="#f4f1e8" font-size="{{POST_TITLE_SIZE}}" class="handwritten">{{POST_TITLE}}</text>
  </g>
  <rect x="0" y="275" width="1080" height="570" fill="#0b2b1e" clip-path="url(#photoWave)"/>
  <image href="{{ACTION_PLAYER_DATA_URI}}" x="0" y="255" width="1080" height="620" preserveAspectRatio="xMidYMid slice" clip-path="url(#photoWave)"/>
  <rect x="0" y="255" width="1080" height="620" fill="url(#photoShade)" clip-path="url(#photoWave)"/>
  <path d="M0 326C216 265 397 348 621 295c204-48 329-39 459 9" fill="none" stroke="#a8cbb4" stroke-width="5" opacity=".8"/>
  <path d="M0 807c111 42 250 49 440-8 219-65 405 29 640-47" fill="none" stroke="#ffffff" stroke-width="5" opacity=".76"/>
  <path d="M0 824c141 37 278 26 446-26 217-67 411 34 634-31" fill="none" stroke="#91c82f" stroke-width="3" opacity=".84"/>
  <text x="48" y="930" fill="#164f32" font-size="36" class="handwritten">{{POST_AUDIENCE}}</text>
  {{SPONSOR_LOGOS}}
  <text x="48" y="1050" fill="#164f32" font-size="27" class="handwritten">#aufgehtsgrün</text>
  <text x="1032" y="1050" text-anchor="end" fill="#092f20" font-size="23" class="handwritten">bsvnordstern.de</text>
</svg>
