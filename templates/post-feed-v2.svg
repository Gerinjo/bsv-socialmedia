<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="BSV Nordstern Instagram Feed Post">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f16"/>
      <stop offset="0.52" stop-color="#0b2b1e"/>
      <stop offset="1" stop-color="#164f32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="16%" r="42%">
      <stop offset="0" stop-color="#a8cbb4" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#a8cbb4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.7" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="photoClip">
      <rect x="110" y="190" width="860" height="470" rx="32"/>
    </clipPath>
    <style>
      .caps{font-family:Inter,Arial,sans-serif;font-weight:800;letter-spacing:3px}
      .sans{font-family:Inter,Arial,sans-serif}
      .serif{font-family:Georgia,'Times New Roman',serif}
    </style>
  </defs>

  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <circle cx="840" cy="190" r="360" fill="url(#glow)"/>

  <g>
    <image href="data:image/png;base64," x="70" y="56" width="96" height="96"/>
    <text x="190" y="92" fill="#a8cbb4" font-size="18" class="caps">BSV NORDSTERN</text>
    <text x="190" y="122" fill="#ffffff" font-size="23" class="sans" font-weight="700">Radolfzell · Fußball</text>
    <rect x="874" y="62" width="140" height="48" rx="24" fill="#f4d638"/>
    <text x="944" y="94" text-anchor="middle" fill="#071f16" font-size="16" class="caps">MATCHDAY</text>
  </g>

  <g>
    <text x="110" y="182" fill="#ffffff" font-size="42" class="sans" font-weight="900">BSV Nordstern</text>
    <text x="110" y="224" fill="#a8cbb4" font-size="26" class="sans" font-weight="700">vs. TSV Musterstadt</text>
    <text x="970" y="203" text-anchor="end" fill="#f4d638" font-size="24" class="caps">14. SPIELTAG</text>
  </g>

  <g>
    <g clip-path="url(#photoClip)">
      <rect x="110" y="190" width="860" height="470" rx="32" fill="#0d3525"/>
      <circle cx="700" cy="120" r="170" fill="#a8cbb4" opacity="0.18"/>
      <circle cx="620" cy="430" r="260" fill="#91c82f" opacity="0.12"/>
      <rect x="110" y="190" width="860" height="470" fill="#f4f1e8" opacity="0.04"/>
      <path d="M110 530C260 420 390 400 540 465C680 525 780 505 970 375V660H110Z" fill="#10251a" opacity="0.7"/>
      <path d="M150 420L330 300L470 420L575 325L760 440L900 360L970 430V660H150Z" fill="#164f32" opacity="0.82"/>
      <circle cx="550" cy="310" r="120" fill="#f4f1e8" opacity="0.12"/>
      <circle cx="550" cy="310" r="76" fill="#f4d638" opacity="0.7"/>
      <path d="M526 315L546 335L592 289" fill="none" stroke="#071f16" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="550" y="520" text-anchor="middle" fill="#f4f1e8" font-size="26" class="caps" opacity="0.85">BILD EINSETZEN</text>
    </g>
  </g>

  <g>
    <rect x="110" y="690" width="860" height="112" rx="26" fill="#f4f1e8" opacity="0.96"/>
    <text x="150" y="750" fill="#10251a" font-size="48" class="sans" font-weight="900">2</text>
    <text x="190" y="750" fill="#10251a" font-size="32" class="sans" font-weight="700">:</text>
    <text x="218" y="750" fill="#10251a" font-size="48" class="sans" font-weight="900">1</text>
    <text x="310" y="740" fill="#10251a" font-size="24" class="caps">BSV NORDSTERN</text>
    <text x="310" y="774" fill="#6c7b71" font-size="20" class="sans" font-weight="700">TSV Musterstadt</text>
    <text x="930" y="758" text-anchor="end" fill="#164f32" font-size="18" class="caps">FREUDE • 14. SPIELTAG</text>
  </g>

  <g>
    <rect x="110" y="826" width="860" height="290" rx="28" fill="#f4f1e8" opacity="0.96"/>
    <text x="144" y="872" fill="#164f32" font-size="28" class="caps">SPIELBERICHT</text>
    <text x="144" y="922" fill="#10251a" font-size="24" class="sans" font-weight="700">Nach einem intensiven Match setzte sich der BSV Nordstern verdient mit 2:1 durch.</text>
    <text x="144" y="968" fill="#10251a" font-size="22" class="sans" font-weight="500">Die Gäste starteten druckvoll, doch nach einer schwachen Phase im Mittelfeld</text>
    <text x="144" y="1002" fill="#10251a" font-size="22" class="sans" font-weight="500">fanden die Nordsterner besser ins Spiel und wurden durch schnelle Kombinationen</text>
    <text x="144" y="1036" fill="#10251a" font-size="22" class="sans" font-weight="500">immer gefährlicher. In der zweiten Halbzeit war der BSV deutlich am Drücker.</text>
    <text x="144" y="1070" fill="#10251a" font-size="22" class="sans" font-weight="500">Die Entscheidung fiel nach einer präzisen Flanke und einem starken Abschluss.</text>
    <text x="144" y="1104" fill="#10251a" font-size="22" class="sans" font-weight="500">Damit bleibt die Mannschaft auf dem richtigen Weg und zeigt erneut ihre Qualität.</text>
  </g>

  <g>
    <rect x="0" y="1148" width="1080" height="202" fill="#f4f1e8"/>
    <rect x="0" y="1148" width="1080" height="202" fill="url(#bg)" opacity="0.38"/>
    <text x="110" y="1206" fill="#f4f1e8" font-size="18" class="caps">SPONSOR</text>
    <rect x="270" y="1180" width="210" height="54" rx="16" fill="#f4d638"/>
    <text x="375" y="1216" text-anchor="middle" fill="#071f16" font-size="18" class="caps">SPARKASSE</text>
    <text x="520" y="1214" fill="#ffffff" font-size="24" class="sans" font-weight="700">Hegau-Bodensee</text>
    <text x="970" y="1214" text-anchor="end" fill="#a8cbb4" font-size="17" class="caps">#AUFGEHTSGRÜN</text>
    <text x="110" y="1275" fill="#ffffff" font-size="20" class="sans" font-weight="600">Ein Moment, der zeigt: BSV ist bereit, wenn es zählt.</text>
  </g>
</svg>
